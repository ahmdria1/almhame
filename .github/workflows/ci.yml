name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: required gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: elawyer
          POSTGRES_PASSWORD: elawyer
          POSTGRES_DB: elawyer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elawyer -d elawyer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clamav:
        image: clamav/clamav:1.4
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 40
          --health-start-period 180s
    env:
      DATABASE_URL: postgresql://elawyer:elawyer@127.0.0.1:5432/elawyer
      TEST_DATABASE_URL: postgresql://elawyer:elawyer@127.0.0.1:5432/elawyer_test
      USE_TESTCONTAINERS: "0"
      JWT_SECRET: ci-jwt-secret-0123456789abcdef
      KMS_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      OTP_PEPPER: ci-otp-pepper
      CHROMIUM_PATH: /usr/bin/chromium
      PAYMENT_GATEWAY: sandbox
      PAYMENT_SANDBOX_SECRET: sandbox-dev-secret
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      REDIS_URL: redis://127.0.0.1:6379
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
      CLAMAV_REQUIRED: "true"
      WEB_ORIGIN: http://127.0.0.1:4720
      ADMIN_ORIGIN: http://127.0.0.1:4730
      API_PUBLIC_URL: http://127.0.0.1:4710
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4710/api
      SITE_URL: http://127.0.0.1:4720
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y postgresql-client tesseract-ocr tesseract-ocr-ara poppler-utils chromium
      - name: Prepare Postgres
        run: |
          PGPASSWORD=elawyer psql -h 127.0.0.1 -U elawyer -d postgres -c "SELECT 1 FROM pg_database WHERE datname = 'elawyer_test'" | grep -q 1 || PGPASSWORD=elawyer psql -h 127.0.0.1 -U elawyer -d postgres -c "CREATE DATABASE elawyer_test"
          PGPASSWORD=elawyer psql -h 127.0.0.1 -U elawyer -d elawyer -c "CREATE EXTENSION IF NOT EXISTS vector"
          PGPASSWORD=elawyer psql -h 127.0.0.1 -U elawyer -d elawyer_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Corpus article audit
        run: node corpus/audit.mjs
      - name: Generate Prisma client
        run: pnpm --filter @elawyer/api exec prisma generate
      - name: Migrate the application database
        run: pnpm --filter @elawyer/api exec prisma migrate deploy
      - name: Typecheck
        run: pnpm typecheck && node scripts/ci/check-tsconfig.mjs
      - name: Lint
        run: pnpm lint
      - name: Jest unit and integration tests
        run: pnpm --filter @elawyer/api test && pnpm --filter @elawyer/mobile test && pnpm --filter @elawyer/web test
      - name: Locale completeness
        run: pnpm --filter @elawyer/i18n test
      - name: Production builds
        run: |
          pnpm --filter @elawyer/api build
          pnpm --filter @elawyer/web build
          pnpm --filter @elawyer/admin build
      - name: Source maps and obfuscation
        run: node scripts/ci/check-builds.mjs
      - name: Lighthouse
        run: node scripts/ci/run-lighthouse.mjs
      - name: Playwright end-to-end tests
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
      - name: Secret scan
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --config .gitleaks.toml --verbose
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Tool trace scan
        run: node --test scripts/ci/check-traces.test.mjs && node scripts/ci/check-traces.mjs --baseline

  deploy:
    name: deploy images
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release images
        run: |
          docker build -f docker/Dockerfile.api -t elawyer-api:ci .
          docker build -f docker/Dockerfile.web -t elawyer-web:ci --build-arg NEXT_PUBLIC_API_URL=https://example.invalid/api --build-arg SITE_URL=http://127.0.0.1:4720 .
          docker build -f docker/Dockerfile.admin -t elawyer-admin:ci --build-arg NEXT_PUBLIC_API_URL=https://example.invalid/api .
