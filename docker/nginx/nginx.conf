worker_processes 2;
worker_rlimit_nofile 4096;
events { worker_connections 1024; }
http {
  include mime.types;
  sendfile on;
  client_max_body_size 20m;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  upstream api_upstream { server api:4710; }
  upstream web_upstream { server web:4720; }
  upstream admin_upstream { server admin:4730; }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;

  server {
    listen 80;
    server_name www.emuhami.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://emuhami.com$request_uri; }
  }

  server {
    listen 80;
    server_name emuhami.com admin.emuhami.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name www.emuhami.com;
    ssl_certificate /etc/letsencrypt/live/emuhami.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emuhami.com/privkey.pem;
    return 301 https://emuhami.com$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name emuhami.com;
    ssl_certificate /etc/letsencrypt/live/emuhami.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emuhami.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name admin.emuhami.com;
    ssl_certificate /etc/letsencrypt/live/emuhami.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emuhami.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://admin_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
