# Hostinger KVM 2: 2 vCPU, 8 GB RAM.
# postgres 2G, api 1280M, web 1G, admin 512M, redis 384M, pgbouncer 128M, nginx 128M.
# About 1.6G remains for the operating system and page cache.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: elawyer
      POSTGRES_PASSWORD: elawyer
      POSTGRES_DB: elawyer
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=40
      - -c
      - wal_buffers=16MB
      - -c
      - random_page_cost=1.1
    shm_size: 512mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elawyer -d elawyer"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://elawyer:elawyer@pgbouncer:6432/elawyer?pgbouncer=true&connection_limit=1
      REDIS_URL: redis://redis:6379
      PORT: "4710"
      NODE_OPTIONS: --max-old-space-size=768
      WEB_ORIGIN: ${WEB_ORIGIN:-https://emuhami.com}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://admin.emuhami.com}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://emuhami.com}
      SMTP_FROM: ${SMTP_FROM:-no-reply@emuhami.com}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.emuhami.com}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    command: sh -c "DATABASE_URL=postgresql://elawyer:elawyer@postgres:5432/elawyer ./node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/main.js"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1280M

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://emuhami.com/api}
        SITE_URL: ${SITE_URL:-https://emuhami.com}
    environment:
      SITE_URL: ${SITE_URL:-https://emuhami.com}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.emuhami.com}
      NODE_OPTIONS: --max-old-space-size=640
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://emuhami.com/api}
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - admin
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/lib/emuhami/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  pgdata:
  redisdata:
