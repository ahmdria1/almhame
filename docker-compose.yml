services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: elawyer
      POSTGRES_PASSWORD: elawyer
      POSTGRES_DB: elawyer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elawyer -d elawyer"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://elawyer:elawyer@pgbouncer:6432/elawyer?pgbouncer=true&connection_limit=1
      REDIS_URL: redis://redis:6379
      PORT: "4710"
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    command: sh -c "DATABASE_URL=postgresql://elawyer:elawyer@postgres:5432/elawyer ./node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/main.js"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1/api}
        SITE_URL: ${SITE_URL}
    environment:
      SITE_URL: ${SITE_URL}
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1/api}
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - admin
      - api
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
